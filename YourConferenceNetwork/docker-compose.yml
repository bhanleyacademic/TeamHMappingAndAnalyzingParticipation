version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database across container restarts
      - db_data:/app/data
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.selfhosted
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped

volumes:
  db_data:
